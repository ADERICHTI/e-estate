<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate - Login & Signup</title>
    <link rel="stylesheet" href="style.css">
    <!--  -->
    
</head>
<body>
    <div class="container">
        <!-- Header Row: Logo & Toggle Buttons -->
        <div class="header-row">
            <div class="logo">
                <img src="logo.png" alt="Logo">
            </div>
            <!-- Toggle Buttons (Login first) -->
            <div class="toggle-buttons">
                <button class="toggle-btn active" data-tab="login">Login</button>
                <button class="toggle-btn" data-tab="signup">Sign up</button>
            </div>
        </div>

        
        <!-- Card Container -->
        <div class="card-container">
            <div class="cards-wrapper" id="cards-wrapper">
                <!-- Login Card -->
                <div class="card" id="login-card">
                <h2 class="card-title">Welcome</h2>
                <p class="card-subtitle">Sign Up if you don't Already Have an Account</p>
                <form id="login-form" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <div class="forgot-password">
                        <button id="forgot" type="button"><b>Forgot password?</b></button>
                    </div>
                    <button id="login-btn" type="button" class="submit-btn">Login</button>

                    <!--Google Button-->
                    <button id="google-sign-in-btn" class="google-sign-in-btn" type="button">
  <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
  </svg>
  <span>Sign in with Google</span>
</button>
                    <div class="error-message" id="login-error"></div>
                    <div class="success-message" id="login-success"></div>
                </form>
            </div>

                <!-- Signup Card -->
                <div class="card" id="signup-card">
                <h2 class="card-title">Create Account</h2>
                <p class="card-subtitle">Join us today</p>
                <form id="signup-form" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm">Confirm Password</label>
                        <input type="password" id="signup-confirm" placeholder="Confirm password" required>
                    </div>
                    <button id="signup-btn" type="button" class="submit-btn">Signup</button>
                    <div class="error-message" id="signup-error"></div>
                    <div class="success-message" id="signup-success"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const toggleBtns = document.querySelectorAll('.toggle-btn');
        const wrapper = document.getElementById('cards-wrapper');
        const loginSuccess = document.getElementById('login-success');

        const setActiveTab = (tab) => {
            toggleBtns.forEach((btn) => {
                const isActive = btn.dataset.tab === tab;
                btn.classList.toggle('active', isActive);
            });

            wrapper.classList.toggle('slide-left', tab === 'signup');
        };

        if (wrapper) {
            const params = new URLSearchParams(window.location.search);
            const requestedTab = params.get('tab') === 'signup' ? 'signup' : 'login';
            setActiveTab(requestedTab);

            if (params.get('signup') === 'success' && loginSuccess) {
                loginSuccess.textContent = 'Account created successfully. Please log in.';
            }

            toggleBtns.forEach((btn) => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    setActiveTab(tab);
                });
            });
        }
    </script>
    <script type="module" src="register.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
