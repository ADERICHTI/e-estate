<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Property Listing</title>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 🎨 THEME VARIABLE MATRIX --- */
        :root {
            --bg-primary:  #101218; /* Midnight Navy */
            --bg-surface: #181d27; /* Slate Dark */
            --accent: #C5A059; /* Matte Gold */
            --text-main: #E0E0E0; /* Soft White */
            --text-muted: #8E9AA8;
            --shadow: rgba(0, 0, 0, 0.4);
            --nav-blend: rgba(10, 14, 20, 0.85);
            --easing: cubic-bezier(0.4, 0.0, 0.2, 1);
            --surface-soft:  #15181f;
            --border: rgba(224,224,224,0.12);
            --danger: #E94F4F; 
        }

        [data-theme="light"] {
            --bg-primary: #F8F9FA; /* Google Off-White */
            --bg-surface: #FFFFFF; /* Pure White */
            --accent: #B08A43;     /* Deeper Gold Accent */
            --text-main: #202124;  /* Google Charcoal */
            --text-muted: #5F6368;
            --shadow: rgba(0, 0, 0, 0.08);
            --nav-blend: rgba(248, 249, 250, 0.85);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #090d13 100%, transparent 40%), var(--bg-primary);
            color: var(--text-main);
            font-family: 'Product Sans', 'Roboto', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .page-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: clamp(2.2rem, 2.4vw, 3rem);
        }

        header p {
            margin: 0;
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            gap: 20px;
        }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.6);
        }

        .section-title {
            margin: 0 0 16px;
            font-size: 1.1rem;
            letter-spacing: 0.02em;
            color: var(--accent);
            font-weight:bold;
        }

        .field-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field-row.three {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field label {
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--muted);
        }

        .field input,
        .field textarea,
        .field select {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 14px 16px;
            font-size: 0.95rem;
            min-height: 44px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field textarea {
            min-height: 120px;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(197,160,89,0.12);
        }
        h1{
            color: #C5A059;;
        }

        .media-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .media-card {
            background: rgba(255,255,255,0.03);
            border: 1px dashed var(--border);
            border-radius: 16px;
            padding: 18px;
            min-height: 170px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-align: center;
            color: var(--text-muted);
        }

        .media-card input {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-main);
        }

        .media-card svg {
            width: 40px;
            height: 40px;
            color: var(--accent);
        }

        .checkbox-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .checkbox-item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255,255,255,0.02);
            color: var(--text-main);
        }

        .checkbox-item input {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
        }

        .inline-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .inline-list .field {
            flex: 1 1 220px;
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
            gap: 12px;
        }

        .button {
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: black;
            padding: 14px 22px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            min-height: 52px;
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(197,160,89,0.18);
        }

        .divider {
            height: 1px;
            background: rgba(255,255,255,0.08);
            margin: 24px 0;
        }

        .admin-list {
            display: grid;
            gap: 12px;
        }

        .admin-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: grid;
            gap: 12px;
        }

        .admin-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .admin-item-title {
            font-weight: 700;
            color: var(--text-main);
        }

        .admin-item-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .small-btn {
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .small-btn.edit {
            background: rgba(197, 160, 89, 0.16);
            color: var(--accent);
        }

        .small-btn.delete {
            background: rgba(233, 79, 79, 0.16);
            color: var(--danger);
        }

        .admin-item form {
            display: grid;
            gap: 12px;
        }

        .admin-item .field-row {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .admin-item .field-row.three {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .admin-item .field input,
        .admin-item .field textarea {
            min-height: 40px;
            padding: 10px 12px;
        }

        .admin-item .field textarea {
            min-height: 90px;
        }

        .empty-state {
            padding: 18px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            text-align: center;
            color: var(--text-muted);
        }

        .rating-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 18px;
            align-items: end;
        }

        .rating-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            margin: 0;
        }

        .rating-label {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .note {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 12px;
            line-height: 1.6;
        }

        @media (max-width: 940px) {
            .field-row,
            .field-row.three,
            .media-grid,
            .checkbox-grid,
            .rating-row {
                grid-template-columns: 1fr;
            }

            .rating-row {
                align-items: stretch;
            }
        }

        @media (max-width: 640px) {
            .page-wrap {
                padding: 16px;
            }

            .card {
                padding: 18px;
                border-radius: 16px;
            }

            header h1 {
                font-size: 2rem;
            }

            .media-card,
            .checkbox-item,
            .field input,
            .field textarea,
            .field select,
            .button {
                width: 100%;
            }

            .media-card {
                min-height: 140px;
            }

            .field input,
            .field textarea,
            .field select {
                padding: 12px 14px;
                font-size: 0.95rem;
            }

            .button-row {
                justify-content: stretch;
            }

            .button {
                width: 100%;
                justify-content:center
            }

            .checkbox-item {
                padding: 12px;
            }

            .field-row.three {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <header>
            <h1>Admin</h1>
          
            <p>Add a New Property to The Listing</p>
        </header>

        <form id="adminPropertyForm">
            <div class="grid">
                <div class="card">
                    <p class="section-title">Media</p>
                    <div class="media-grid">
                        <div class="media-card">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h7"></path></svg>
                            <label>Upload property images</label>
                            <input type="file" accept="image/*" multiple>
                        </div>
                        <div class="media-card">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"></path><path d="M10 8l6 4-6 4V8z"></path></svg>
                            <label>Upload walkthrough video</label>
                            <input type="file" accept="video/*">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <p class="section-title">Property Details</p>
                    <div class="field-row">
                        <div class="field">
                            <label for="property-title">Property Name / Title / Headline</label>
                            <input id="property-title" type="text" placeholder="Enter property headline">
                        </div>
                        <div class="field">
                            <label for="property-state">State</label>
                            <input id="property-state" type="text" placeholder="State">
                        </div>
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label for="property-city">City</label>
                            <input id="property-city" type="text" placeholder="City">
                        </div>
                        <div class="field">
                            <label for="property-price">Price</label>
                            <input id="property-price" type="number" placeholder="e.g. ₦4,050,000">
                        </div>
                    </div>

                    <div class="field-row three">
                        <div class="field">
                            <label for="plot-area">Land Size / Plot Area</label>
                            <input id="plot-area" type="number" placeholder="e.g. 5,000 sq ft">
                        </div>
                        <div class="field">
                            <label for="living-space">Area of Living / House Space</label>
                            <input id="living-space" type="number" placeholder="e.g. 2,500 sq ft">
                        </div>
                        <div class="field">
                            <label for="bedrooms">Number of Bedrooms</label>
                            <input id="bedrooms" type="number" min="0" placeholder="0">
                        </div>
                    </div>

                    <div class="field-row three">
                        <div class="field">
                            <label for="bathrooms">Number of Bathrooms / Toilets</label>
                            <input id="bathrooms" type="number" min="0" placeholder="0">
                        </div>
                        <div class="field">
                            <label for="other-amenities">Other Amenities</label>
                            <input id="other-amenities" type="text" placeholder="Add amenities separated by commas">
                        </div>
                        <div class="field">
                            <label for="summary">Summary</label>
                            <textarea id="summary" placeholder="Add a brief property summary"></textarea>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <p class="section-title">Interior Details</p>
                    <div class="checkbox-grid">
                        <label class="checkbox-item"><input type="checkbox"> Main Living Room</label>
                        <label class="checkbox-item"><input type="checkbox"> Family Lounge</label>
                        <label class="checkbox-item"><input type="checkbox"> Dining Area</label>
                        <label class="checkbox-item"><input type="checkbox"> Kitchen & Pantry / Store</label>
                        <label class="checkbox-item"><input type="checkbox"> Laundry Room</label>
                        <label class="checkbox-item"><input type="checkbox"> Study / Home Office</label>
                        <label class="checkbox-item"><input type="checkbox"> Guest Bedrooms</label>
                        <label class="checkbox-item"><input type="checkbox"> Master Suite (Bedroom, Walk-in Closet, Balcony)</label>
                    </div>
                </div>

                <div class="card">
                    <p class="section-title">Amenities & Infrastructure</p>
                    <div class="checkbox-grid">
                        <label class="checkbox-item"><input type="checkbox"> Gate System</label>
                        <label class="checkbox-item"><input type="checkbox"> Gatehouse / Security Post</label>
                        <label class="checkbox-item"><input type="checkbox"> Outdoor Flooring</label>
                        <label class="checkbox-item"><input type="checkbox"> Backyard</label>
                        <label class="checkbox-item"><input type="checkbox"> Lawn</label>
                        <label class="checkbox-item"><input type="checkbox"> Garden</label>
                        <label class="checkbox-item"><input type="checkbox"> Rooftops</label>
                        <label class="checkbox-item"><input type="checkbox"> Patios</label>
                        <label class="checkbox-item"><input type="checkbox"> Balconies</label>
                        <label class="checkbox-item"><input type="checkbox"> Boys' Quarters (BQ) Availability</label>
                        <label class="checkbox-item"><input type="checkbox"> Water Source: Borehole</label>
                        <label class="checkbox-item"><input type="checkbox"> Water Source: Well</label>
                        <label class="checkbox-item"><input type="checkbox"> Water Storage Capacity (Tanks)</label>
                        <label class="checkbox-item"><input type="checkbox"> Water Treatment Plant</label>
                        <label class="checkbox-item"><input type="checkbox"> Generator House / Enclosure</label>
                        <label class="checkbox-item"><input type="checkbox"> Solar / Inverter Pre-wiring</label>
                        <label class="checkbox-item"><input type="checkbox"> Drainage Infrastructure</label>
                        <label class="checkbox-item"><input type="checkbox"> Neighborhood Security Level</label>
                    </div>
                </div>

                <div class="card">
                    <p class="section-title">Property Rating</p>
                    <div class="rating-row">
                        <div>
                            <p class="rating-value">Out of  5.0</p>
                            <p class="rating-label">Rate the property from 0.0 to 5.0</p>
                        </div>
                        <div class="field">
                            <label for="property-rating">Rating</label>
                            <input id="property-rating" type="number" step="0.1" min="0" max="5" placeholder="0.0">
                        </div>
                    </div>
                    <p class="note"></p>
                </div>
            </div>

            <div class="button-row">
                <button type="submit" class="button">Add Property</button>
            </div>
        </form>

        <div class="card" style="margin-top: 20px;">
            <p class="section-title">Manage Existing Properties</p>
            <div id="adminPropertyList" class="admin-list"></div>
        </div>
    </div>
    <script>
        const STORAGE_KEY = 'archstone_properties';
        const form = document.getElementById('adminPropertyForm');
        const propertyList = document.getElementById('adminPropertyList');

        function getAllProperties() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch (error) {
                console.warn('Unable to load properties.', error);
                return [];
            }
        }

        function saveProperties(properties) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(properties));
        }

        function getSelectedAmenities() {
            return Array.from(document.querySelectorAll('.checkbox-grid input[type="checkbox"]'))
                .filter((checkbox) => checkbox.checked)
                .map((checkbox) => checkbox.parentElement.textContent.trim());
        }

        function formatPrice(value) {
            const numericValue = Number(value);
            if (!value || Number.isNaN(numericValue)) {
                return 'Price on request';
            }
            return `₦${numericValue.toLocaleString()}`;
        }

        function renderAdminPropertyList() {
            if (!propertyList) return;

            const properties = getAllProperties();
            if (!properties.length) {
                propertyList.innerHTML = '<div class="empty-state">No custom properties yet.</div>';
                return;
            }

            propertyList.innerHTML = properties.map((property, index) => `
                <div class="admin-item">
                    <div class="admin-item-header">
                        <div class="admin-item-title">${property.title}</div>
                        <div class="admin-item-actions">
                            <button type="button" class="small-btn edit" data-index="${index}">Edit</button>
                            <button type="button" class="small-btn delete" data-index="${index}">Delete</button>
                        </div>
                    </div>
                    <form data-index="${index}">
                        <div class="field-row">
                            <div class="field">
                                <label>Title</label>
                                <input name="title" value="${property.title}" required>
                            </div>
                            <div class="field">
                                <label>Location</label>
                                <input name="location" value="${property.location || ''}">
                            </div>
                        </div>
                        <div class="field-row">
                            <div class="field">
                                <label>Price</label>
                                <input name="price" value="${property.price || ''}">
                            </div>
                            <div class="field">
                                <label>Rating</label>
                                <input name="rating" value="${property.rating || ''}">
                            </div>
                        </div>
                        <div class="field-row three">
                            <div class="field">
                                <label>Space</label>
                                <input name="space" value="${property.space || ''}">
                            </div>
                            <div class="field">
                                <label>Category</label>
                                <input name="category" value="${property.category || ''}">
                            </div>
                            <div class="field">
                                <label>Summary</label>
                                <textarea name="description">${property.description || ''}</textarea>
                            </div>
                        </div>
                        <div class="button-row">
                            <button type="submit" class="button">Save Changes</button>
                        </div>
                    </form>
                </div>
            `).join('');
        }

        if (form) {
            form.addEventListener('submit', function (event) {
                event.preventDefault();

                const title = document.getElementById('property-title').value.trim();
                const state = document.getElementById('property-state').value.trim();
                const city = document.getElementById('property-city').value.trim();
                const priceValue = document.getElementById('property-price').value.trim();
                const plotArea = document.getElementById('plot-area').value.trim();
                const livingSpace = document.getElementById('living-space').value.trim();
                const bedrooms = document.getElementById('bedrooms').value.trim();
                const bathrooms = document.getElementById('bathrooms').value.trim();
                const otherAmenities = document.getElementById('other-amenities').value.trim();
                const summary = document.getElementById('summary').value.trim();
                const rating = document.getElementById('property-rating').value.trim();

                if (!title || !city || !state) {
                    alert('Please add a title, city, and state before submitting.');
                    return;
                }

                const selectedAmenities = getSelectedAmenities();
                const featureList = [
                    bedrooms ? `${bedrooms} Bedrooms` : null,
                    bathrooms ? `${bathrooms} Bathrooms` : null,
                    livingSpace ? `${livingSpace} sq ft living space` : null,
                    plotArea ? `${plotArea} sq ft land area` : null,
                    ...otherAmenities.split(',').map((item) => item.trim()).filter(Boolean)
                ].filter(Boolean);

                const newProperty = {
                    id: `prop-${Date.now()}`,
                    title,
                    category: 'Custom',
                    price: formatPrice(priceValue),
                    rating: rating ? Number(rating).toFixed(1) : '4.7',
                    description: summary || 'Newly added property from the admin dashboard.',
                    space: livingSpace ? `${livingSpace} sq ft` : (plotArea ? `${plotArea} sq ft` : 'Flexible layout'),
                    location: `${city}, ${state}`,
                    features: [...featureList, ...selectedAmenities].slice(0, 8),
                    images: [
                        'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80',
                        'https://images.unsplash.com/photo-1568605114967-8130f3a36994?auto=format&fit=crop&w=800&q=80'
                    ]
                };

                try {
                    const storedProperties = getAllProperties();
                    storedProperties.unshift(newProperty);
                    saveProperties(storedProperties);
                    form.reset();
                    renderAdminPropertyList();
                    alert('Property added successfully. It is now visible on the main page.');
                    window.location.href = '2main.html';
                } catch (error) {
                    console.error('Unable to save property:', error);
                    alert('Could not save the property. Please try again.');
                }
            });
        }

        propertyList?.addEventListener('click', function (event) {
            const button = event.target.closest('button');
            if (!button) return;

            const index = Number(button.dataset.index);
            const properties = getAllProperties();

            if (button.classList.contains('delete')) {
                properties.splice(index, 1);
                saveProperties(properties);
                renderAdminPropertyList();
                alert('Property removed from the main page.');
                return;
            }

            if (button.classList.contains('edit')) {
                const item = button.closest('.admin-item');
                item.querySelector('form').style.display = item.querySelector('form').style.display === 'none' ? 'grid' : 'grid';
            }
        });

        propertyList?.addEventListener('submit', function (event) {
            event.preventDefault();
            const formElement = event.target;
            const index = Number(formElement.dataset.index);
            const properties = getAllProperties();
            const property = properties[index];

            if (!property) return;

            const formData = new FormData(formElement);
            property.title = formData.get('title')?.toString().trim() || property.title;
            property.location = formData.get('location')?.toString().trim() || property.location;
            property.price = formData.get('price')?.toString().trim() || property.price;
            property.rating = formData.get('rating')?.toString().trim() || property.rating;
            property.space = formData.get('space')?.toString().trim() || property.space;
            property.category = formData.get('category')?.toString().trim() || property.category;
            property.description = formData.get('description')?.toString().trim() || property.description;

            saveProperties(properties);
            renderAdminPropertyList();
            alert('Property updated successfully.');
        });

        renderAdminPropertyList();
    </script>
</body>
<footer>
    <p> </p>
</footer>
</html>
